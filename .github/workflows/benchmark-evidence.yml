name: Benchmark Evidence

on:
  workflow_dispatch:
    inputs:
      policy_profile:
        description: Policy profile for evaluation
        required: false
        default: ci-hosted
        type: choice
        options:
          - ci-hosted
          - ci-dedicated
      include_optional:
        description: Include JSON/YAML loader benchmarks
        required: false
        default: false
        type: boolean
      baseline_path:
        description: Optional baseline JSON path (repo-relative)
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  windows-benchmark:
    name: Windows benchmark evidence
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@b11cc3033d90ce17a35fdcffae9bff6388542f6a # v3.1
        with:
          r2-endpoint: ${{ vars.VCPKG_R2_ENDPOINT }}
          r2-bucket: ${{ vars.VCPKG_R2_BUCKET }}
          r2-read-access-key-id: ${{ secrets.VCPKG_R2_READ_ACCESS_KEY_ID }}
          r2-read-secret-access-key: ${{ secrets.VCPKG_R2_READ_SECRET_ACCESS_KEY }}
          r2-write-access-key-id: ${{ secrets.VCPKG_R2_WRITE_ACCESS_KEY_ID }}
          r2-write-secret-access-key: ${{ secrets.VCPKG_R2_WRITE_SECRET_ACCESS_KEY }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Resolve benchmark options
        id: opts
        shell: pwsh
        # Inputs reach the script through env:, never ${{ }} in the script
        # text, so a dispatch value is data, not code (#151).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_POLICY_PROFILE: ${{ github.event.inputs.policy_profile }}
          INPUT_INCLUDE_OPTIONAL: ${{ github.event.inputs.include_optional }}
          INPUT_BASELINE_PATH: ${{ github.event.inputs.baseline_path }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $profile = "ci-hosted"
          $includeOptional = "false"
          $baseline = ""

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:INPUT_POLICY_PROFILE -in @("ci-hosted", "ci-dedicated")) {
              $profile = $env:INPUT_POLICY_PROFILE
            }
            elseif ($env:INPUT_POLICY_PROFILE -ne "") {
              throw "policy_profile must be ci-hosted or ci-dedicated."
            }
            if ($env:INPUT_INCLUDE_OPTIONAL -eq "true") {
              $includeOptional = "true"
            }
            if ($env:INPUT_BASELINE_PATH -ne "") {
              $requested = $env:INPUT_BASELINE_PATH
              if ($requested -match "[\r\n]") {
                throw "baseline_path must be a single line."
              }
              $root = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
              $full = [System.IO.Path]::GetFullPath((Join-Path $root $requested))
              $inside = $full.StartsWith($root + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)
              if (-not $inside -or -not (Test-Path -LiteralPath $full -PathType Leaf)) {
                throw "baseline_path must name a file inside the repository."
              }
              $baseline = $requested
            }
          }

          if ($baseline -eq "") {
            if ($profile -eq "ci-hosted") {
              $candidate = "benchmarks/policy/baselines/ci-hosted.windows-2022.json"
              if (Test-Path $candidate) {
                $baseline = $candidate
              }
            }
            elseif ($profile -eq "ci-dedicated") {
              $candidate = "benchmarks/policy/baselines/ci-dedicated.windows-2022.json"
              if (Test-Path $candidate) {
                $baseline = $candidate
              }
              else {
                throw "ci-dedicated profile requires a dedicated baseline file. Provide baseline_path input or commit $candidate."
              }
            }
          }

          $benchDir = "artifacts/benchmarks/$($env:RUN_ID)_$($env:RUN_ATTEMPT)_ci-windows-release"

          "profile=$profile" >> $env:GITHUB_OUTPUT
          "include_optional=$includeOptional" >> $env:GITHUB_OUTPUT
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "bench_dir=$benchDir" >> $env:GITHUB_OUTPUT

      - name: Run benchmark suite + policy evaluation
        shell: pwsh
        env:
          BENCH_DIR: ${{ steps.opts.outputs.bench_dir }}
          POLICY_PROFILE: ${{ steps.opts.outputs.profile }}
          INCLUDE_OPTIONAL: ${{ steps.opts.outputs.include_optional }}
          BASELINE: ${{ steps.opts.outputs.baseline }}
        run: |
          $params = @{
            Preset = "ci-windows-release"
            Config = "Release"
            OutputDir = $env:BENCH_DIR
            PolicyProfile = $env:POLICY_PROFILE
          }

          if ($env:INCLUDE_OPTIONAL -eq "true") {
            $params["IncludeOptional"] = $true
          }

          if ($env:BASELINE -ne "") {
            $params["Baseline"] = $env:BASELINE
          }

          .\scripts\bench.ps1 @params

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-evidence-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.opts.outputs.bench_dir }}
          if-no-files-found: warn
