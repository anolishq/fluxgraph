name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fluxgraph-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
      docs: ${{ steps.docsfilter.outputs.docs }}
      conformance: ${{ steps.conformancefilter.outputs.conformance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'
      # The files the docs-check workflow lints and link-checks, so the docs gate
      # skips (and ok stays green) on PRs that touch none of them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docsfilter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'
      # The version 2 semantics and the tests of that text.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: conformancefilter
        with:
          filters: |
            conformance:
              - 'conformance/**'
              - 'docs/semantics_spec_v2.md'
              - '.github/workflows/ci.yml'

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    uses: anolishq/.github/.github/workflows/docs-check.yml@f4817837f29993c35b5350fbb5dfe2563437fcde # v2

  python-lint:
    name: Python Linting (ruff)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff checks
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      # The release workflow's glibc floor check only runs at a tag; test the
      # script here so a broken edit is caught on the PR. Needs only bash and objdump.
      - name: Test scripts/check-glibc-floor.sh
        run: bash tests/scripts/check-glibc-floor-test.sh

  python-typecheck:
    name: Python Type Checking (mypy)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy tests

  # The version 2 semantics are tested by vectors, against two Python readings
  # of the text. Nothing here builds or runs the library.
  conformance:
    name: Conformance (${{ matrix.reading }} reading)
    needs: [changes]
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - reading: reference
            flag: ""
          - reading: second
            flag: "--second"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run the vectors
        run: uv run python conformance/run.py ${{ matrix.flag }}

      - name: Check the host contract
        run: uv run python conformance/contract.py ${{ matrix.flag }}

  linux-matrix:
    name: Linux ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core-only
            preset: ci-linux-release
            grpc_integration: false
          - lane: diagram-dot
            preset: ci-linux-release-diagram
            grpc_integration: false
          - lane: json
            preset: ci-linux-release-json
            grpc_integration: false
          - lane: yaml
            preset: ci-linux-release-yaml
            grpc_integration: false
          - lane: server-enabled
            preset: ci-linux-release-server
            grpc_integration: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-linux
          # server-enabled is the sole writer (its closure — grpc+protobuf+json+
          # yaml+gtest — is the union of every lane). The 4 subset lanes restore
          # only, so a 1-min subset save can't clobber the shared key and drop
          # grpc, which forced a ~65min grpc rebuild on the server lane every run.
          cache-write: ${{ matrix.lane == 'server-enabled' }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: ${{ matrix.grpc_integration }}
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ matrix.grpc_integration }}
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python integration deps
        if: ${{ matrix.grpc_integration }}
        run: uv sync --locked --extra dev

      - name: Configure
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.grpc_integration }}" = "true" ]; then
            EXTRA_ARGS="-DPython3_EXECUTABLE=$(pwd)/.venv/bin/python"
          fi
          cmake --preset "${{ matrix.preset }}" $EXTRA_ARGS

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Generate Python Protobuf Bindings
        if: ${{ matrix.grpc_integration }}
        run: |
          bash ./scripts/generate_proto_python.sh build-server/python

      - name: Run tests
        run: ctest --preset "${{ matrix.preset }}"

  # The version 2 core, built and run against the conformance vectors through
  # its driver. The asan lane is the same checks under ASan and UBSan.
  v2-core:
    name: Version 2 core (${{ matrix.lane }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: release
            preset: ci-linux-release-v2
          - lane: asan
            preset: ci-linux-v2-asan

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-linux
          # No dependencies are built (tests off) — read-only so it can't clobber
          # the shared x64-linux key written by the server-enabled lane.
          cache-write: "false"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build the driver and the C++ checks
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Check handles and what allocates
        run: ./build/${{ matrix.preset }}/tests/v2/fluxgraph_v2_handles_and_memory

      - name: Run the conformance checks against the core
        env:
          FLUXGRAPH_V2_DRIVER: ${{ github.workspace }}/build/${{ matrix.preset }}/tools/fluxgraph_v2_driver/fluxgraph_v2_driver
        run: |
          uv run python conformance/run.py --cpp
          uv run python conformance/contract.py --cpp
          uv run python conformance/compare.py --cpp
          uv run python conformance/steps.py --cpp
          uv run python conformance/cpp/edges.py
          uv run python conformance/cpp/filter.py
          uv run python conformance/cpp/saved_state.py
          uv run python conformance/cpp/loaders.py
          # The same writes, each made through a handle and not by name.
          FLUXGRAPH_V2_WRITES=handle uv run python conformance/run.py --cpp
          FLUXGRAPH_V2_WRITES=handle uv run python conformance/compare.py --cpp

  # Apple clang, whose libc++ differs from the libstdc++ and MSVC lanes. The
  # core has no dependencies, so this needs no vcpkg.
  v2-core-macos:
    name: Version 2 core (Apple clang)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -S . -B build/v2 -DFLUXGRAPH_BUILD_V2=ON -DFLUXGRAPH_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build the driver
        run: cmake --build build/v2 --target fluxgraph_v2_driver --parallel

  strict-dimensional-validation:
    name: Strict dimensional validation
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ python3

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-linux
          # Subset closure (core preset, no grpc) — read-only so it can't clobber
          # the shared x64-linux key written by the server-enabled lane.
          cache-write: "false"

      - name: Run strict dimensional validation
        id: dimensional
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="artifacts/dimensional-validation/${{ github.run_id }}_${{ github.run_attempt }}_ci-linux-release"
          python3 scripts/run_dimensional_validation.py \
            --preset ci-linux-release \
            --output-dir "$OUT_DIR" \
            --enforce
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload strict-dimensional artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: strict-dimensional-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.dimensional.outputs.out_dir }}
          if-no-files-found: error

  windows-core:
    name: Windows core-only
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-windows-v145

      - name: Configure
        run: cmake --preset ci-windows-release

      - name: Build
        run: cmake --build --preset ci-windows-release --parallel

      - name: Run C++ tests
        run: ctest --preset ci-windows-release

  windows-diagram:
    name: Windows diagram-dot
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-windows-v145

      - name: Configure
        run: cmake --preset ci-windows-release-diagram

      - name: Build
        run: cmake --build --preset ci-windows-release-diagram --parallel

      - name: Run C++ tests
        run: ctest --preset ci-windows-release-diagram

  diagram-render-smoke:
    name: Diagram Render Smoke
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ graphviz

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@f4817837f29993c35b5350fbb5dfe2563437fcde # v2.11
        with:
          triplet: x64-linux
          # Subset closure (diagram preset, no grpc) — read-only so it can't
          # clobber the shared x64-linux key written by the server-enabled lane.
          cache-write: "false"

      - name: Configure diagram preset
        run: cmake --preset ci-linux-release-diagram

      - name: Build diagram tool
        run: cmake --build --preset ci-linux-release-diagram --target fluxgraph_diagram --parallel

      - name: Render SVG smoke output
        run: |
          set -euo pipefail
          BIN="./build/ci-linux-release-diagram/tools/fluxgraph-diagram"
          OUT="$RUNNER_TEMP/graph-smoke.svg"
          "$BIN" --in ./examples/03_json_graph/graph.json --out "$OUT" --format svg
          test -s "$OUT"

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@f4817837f29993c35b5350fbb5dfe2563437fcde # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  cpp-format:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@5d26f03ad4502fdf6537e39daf7ea3864afc911f # clang-tidy-diff
    with:
      # x64-linux (not the gate's x64-linux-static default) so we reuse the warm
      # vcpkg cache the server-enabled CI lane writes — its closure (grpc+protobuf
      # +json+yaml+gtest) is exactly ci-linux-tidy's. With the static default the
      # configure step rebuilt grpc from source cold and hit the 30-min timeout.
      triplet: x64-linux
      configure-preset: ci-linux-tidy
      apt-packages: graphviz
      blocking: true
      # After a runner image update the cache key misses until the server-enabled
      # lane saves on the new image, and this job builds the whole closure, grpc
      # included, from source before clang-tidy runs (anolishq/.github#184).
      # A warm cache finishes in under 10 minutes.
      timeout-minutes: 120

  ok:
    name: ok
    if: always()
    needs: [changes, docs, python-lint, python-typecheck, conformance, linux-matrix, v2-core, v2-core-macos, strict-dimensional-validation, windows-core, windows-diagram, diagram-render-smoke, version-sync, cpp-format, clang-tidy]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: anolishq/.github/.github/actions/require-needs-passed@f4817837f29993c35b5350fbb5dfe2563437fcde # v2
        with:
          results: ${{ join(needs.*.result, ' ') }}
      - name: Pass
        run: echo 'All checks passed or were skipped'
