# 7.8.8: a delay in a loop that holds a model gives a value it took in as
# uncertain as good, once the loop is no longer within settle of its doubt.
# An integral controller, i = last i + (r - y), with the plant
# x' = 0.5 x + 0.5 i. One uncertain setpoint at tick 3; settle is 3 ticks.
# Without the rule the integral would stay uncertain for good.
rules: [7.8.8]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: plant, type: state_space, in: {u: i}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 3s}, out: {y: y}}
  - {id: acc, type: delay, in: {x: i}, settings: {initial: 0}, out: {y: p}}
  - {id: ctl, type: formula, in: {p: acc.y, r: r, y: plant.y}, settings: {expr: "p + (r - y)"}, out: {y: i}}
calls:
  - {r: 2, y: 0, i: 2, p: 0}
  - {r: 2, y: 1, i: 3, p: 2}
  - {r: 2, y: 2, i: 3, p: 3}
  - {r: {v: 2, state: uncertain}, y: 2.5, i: {u: 2.5}, p: 3}  # tick 3: the loop's doubt
  - {r: 2, y: {u: 2.5}, i: {u: 2}, p: {u: 2.5}}
  - {r: 2, y: {u: 2.25}, i: {u: 1.75}, p: {u: 2}}
  - {r: 2, y: {u: 2}, i: {u: 1.75}, p: {u: 1.75}}             # tick 6: the third after it
  - {r: 2, y: 1.875, i: 1.875, p: 1.75}                       # taken in as uncertain, and given as good
