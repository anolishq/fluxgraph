# 7.9.5, 7.9.7: a refused measurement makes its tick uncertain. With
# max_refused of 1, the second in a row is not refused: the variance grows
# by p0, and it is used, and that tick is uncertain too. x' = x from 0, variance 1, r 1, gate 2 sigmas.
# Tick 0: innovation 10 against 2 * root 2: refused. Tick 1: again over
# the gate, the second in a row: the variance is 1 + 1, the spread 3, the
# gain 2/3. Its normalised innovation squared is from before the variance
# grew, 100 / 2. Tick 2: 10/3 against 2 * root (5/3): refused, the first of
# a new run.
rules: [7.9.5, 7.9.7, 7.9.8]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[1]], B: [0], C: [1]}
      q: {x0: 0}
      p0: {x0: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
      gate: 2
      max_refused: 1
    out: {x0: x, sigma_x0: sigma, refused_z: rejected, nis_z: nis}
calls:
  - {u: 0, z: 10, x: {u: 0}, sigma: {u: 1}, rejected: 1, nis: 50}
  - {z: 10, x: {u: 6.666666666666667}, sigma: {u: 0.816496580927726}, rejected: 1, nis: 50}
  - {z: 10, x: {u: 6.666666666666667}, sigma: {u: 0.816496580927726}, rejected: 2, nis: 6.666666666666666}
