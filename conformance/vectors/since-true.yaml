# 7.3.2: true when the input has not been true for longer than 2 s. An unusable
# input counts as not true, the output is always good, and the clock starts at
# the first tick.
rules: [7.3.2]
period: 1s
inputs: {x: {}}
blocks:
  - {id: s, type: since_true, in: {x: x}, settings: {time: 2s}, out: {y: y}}
ticks:
  - {x: 0, y: false}
  - {x: 0, y: false}
  - {x: 0, y: false}                # 2 s: not longer than 2 s
  - {x: 0, y: true}
  - {x: 1, y: false}
  - {x: bad, y: false}
  - {x: bad, y: false}
  - {x: bad, y: true}
  - {x: 1, y: false}
