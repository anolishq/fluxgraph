# 3.7, 7.10: a value a fallback puts in carries no sample time: it is not a
# sample of anything. x is written once, as 0; 1 / x is bad on every tick
# and the fallback stands in, and the window, which takes only new
# samples, takes none.
rules: [3.7, 7.10]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "1 / x"}, fallback: {y: 0}}
  - {id: w, type: window, in: {x: f.y}, settings: {window: 3s, min_good: 0.3, only_new: true}, out: {count: count}}
calls:
  - {x: 0, count: 0}
  - {count: 0}
  - {count: 0}
