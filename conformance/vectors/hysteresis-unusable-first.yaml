# 7.5.2: an unusable input shows before anything is decided, and leaves it
# unsure: the first decision is then good only on a good input at a threshold.
rules: [7.5.2, 7.5.3]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: h, type: hysteresis, in: {x: x}, settings: {rise: 10, fall: 5}, out: {y: y}}
calls:
  - {x: bad, y: bad}
  - {x: 7, y: not_ready}
  - {x: 12, y: true}
