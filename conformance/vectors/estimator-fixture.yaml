# 7.9, Appendix B. tau is one period over ln 2, so a = 0.5; q = 1 per second
# and r = 1. Values worked by hand from the equations of Appendix B.
rules: [7.9.1, 7.9.2, 7.9.3, 7.9.4, B]
period: 1s
inputs: {z: {}, m: {}}
blocks:
  - id: k
    type: kalman1
    in: {z: z, model: m}
    settings: {tau: 1.4426950408889634s, q: 1, r: 1, max_coast: 2s}
    out: {x: x, sigma: sigma}
calls:
  - {m: 0, x: not_ready, sigma: not_ready}
  - {z: 10, x: 10, sigma: 1}                           # x = z, var = r
  # z stands and is not new: predict only. x = 5, var = 0.25 + 1
  - {x: 5, sigma: 1.118033988749895}
  # predict: x = 2.5, var = 1.3125. correct: k = 1.3125 / 2.3125
  - {z: 6, x: 4.486486486486486, sigma: 0.753370803500884}
  # no model and no measurement: x stays, var grows by q each tick
  - {z: bad, m: bad, x: 4.486486486486486, sigma: 1.2520253861514021}
  - {x: 4.486486486486486, sigma: 1.602363119760177}   # 2 s since a correction
  - {x: {u: 4.486486486486486}, sigma: {u: 1.88880056320607}}
  # an uncertain measurement corrects, and the outputs stay uncertain
  - {z: {v: 4.486486486486486, state: uncertain}, x: {u: 4.486486486486486}, sigma: {u: 0.905752918579103}}
  # the same value written again is new
  - {z: 4.486486486486486, x: 4.486486486486486, sigma: 0.8033921199831042}
