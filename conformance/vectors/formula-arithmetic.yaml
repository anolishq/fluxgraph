# Appendix A: numbers, precedence, grouping from the left, and the functions.
rules: [A.formula]
period: 1s
inputs: {x: {}}
blocks:
  - {id: p, type: formula, in: {x: x}, settings: {expr: "-x + 2 * 3 - 8 / 4 / 2"}, out: {y: p}}
  - {id: q, type: formula, in: {x: x}, settings: {expr: "pow(x + 1, 3) + sqrt(16) + abs(0 - 3) + min(x, 5) + 2 * max(x, 5)"}, out: {y: q}}
  - {id: r, type: formula, in: {x: x}, settings: {expr: "exp(ln(x * 2))"}, out: {y: r}}
  - {id: s, type: formula, in: {x: x}, settings: {expr: "x * 0 + 1.5e1 + 2E-1 * 10"}, out: {y: s}}
  - {id: t, type: formula, in: {x: x}, settings: {expr: "not x > 2 or x == 1 and false"}, out: {y: t}}
  - {id: u, type: formula, in: {x: x}, settings: {expr: "2 - -x - (3 - 1)"}, out: {y: u}}
calls:
  # p: -1 + 6 - 1; q: 8 + 4 + 3 + 1 + 10; t: (not (x > 2)) or ((x == 1) and false)
  - {x: 1, p: 4, q: 26, r: 2, s: 17, t: true, u: 1}
  # p: -3 + 6 - 1; q: 64 + 4 + 3 + 3 + 10
  - {x: 3, p: 2, q: 84, r: 6, s: 17, t: false, u: 3}
