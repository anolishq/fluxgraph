# 7.8.8: refused: a loop has one settle, and its model blocks state two.
rules: [7.8.8]
period: 1s
inputs: {sp: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: second.y}, settings: {kp: 1}}
  - {id: first, type: state_space, in: {u: c.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
  - {id: second, type: state_space, in: {u: first.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 3s}}
expect: compile_error
error_mentions: [settle]
