# 8.6, 7.9.9: at a stall an estimator predicts once more for each tick
# passed over, and its variance does not grow by p0: it is on one clock.
# The model does not move and q is 0, so nothing changes but the state
# of the tick that runs. No measurement is written.
rules: [8.6, 7.9.1]
period: 1s
max_catch_up: 1
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[1]], B: [0], C: [1]}
      q: {x0: 0}
      p0: {x0: 4}
      measure: {z: {of: y, r: 1}}
      consistency: none
    out: {sigma_x0: sigma}
calls:
  - {now: 0, u: 0, sigma: 2}
  - {now: 5, gap: true, skipped: 4, u: 0, sigma: {u: 2}}
