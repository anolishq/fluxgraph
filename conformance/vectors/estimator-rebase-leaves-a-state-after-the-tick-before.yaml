# 7.9.9: at a rebase a state that stands after the tick before the one that
# runs stays where it stands. The call at 1.3125 s runs tick 1, and its
# sample is at place 21: the state stands there. After the rebase tick 2
# runs: the variance grows by p0, and what is given is carried on 11
# sixteenths from place 21, and not 16 from tick 1. The model is x' = u
# with u of 16 and q of 16 a second, so a sixteenth adds 1 to each.
rules: [7.9.9, 7.9.8]
period: 1s
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 16}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 16, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- {now: 1.3125, z: 21, x: 21.0, sigma: 0.9775252199076786, innovation: 0.0, late: 0.0}
- {$rebase: true}
- now: 7
  gap: true
  x: {u: 32.0}
  sigma: {u: 3.599382663118157}
  innovation: not_ready
  late: 0.0
