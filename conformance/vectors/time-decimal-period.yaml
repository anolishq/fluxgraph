# 6.6, 6.2: at a period of 100 ms every time is exact: one tick per call.
# Three periods of 0.1 come to more than 0.3.
rules: [6.6, 6.2]
period: 100ms
blocks:
  - {id: i, type: integrate, in: {x: 1}, settings: {per: 100ms}, out: {y: n}}
calls:
  - {now: 0, n: 1}
  - {now: 0.1, n: 2}
  - {now: 0.2, n: 3}
  - {now: 0.3, n: 4}
  - {now: 0.4, n: 5}
  - {now: 0.5, n: 6}
  - {now: 0.6, n: 7}
  - {now: 0.7, n: 8}
  - {now: 0.8, n: 9}
  - {now: 0.9, n: 10}
  - {now: 1.0, n: 11}
  - {now: 1.1, n: 12}
  - {now: 1.2, n: 13}
