# 8.1, 7.9.3: a reset returns an estimator to its initial state, the sample
# time last considered on each port among it: after the reset a sample
# older than the one considered before it is the first, and is considered.
rules: [8.1, 7.9.3]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: 0, z: z}
    settings: {model: {type: state_space, A: [[1]], B: [0], C: [1]}, q: {x0: 0}, p0: {x0: 1}, measure: {z: {of: y, r: 1}}, consistency: none}
    out: {x0: x, innovation_z: innovation}
calls:
  - {now: 0, z: 2, x: 1, innovation: 2}
  - {$reset: true}
  - {now: 0, z: {v: 2, at: -5}, x: 1, innovation: 2}
