# 7.2.4: a value that is not finite is bad, whatever state it was written with.
rules: [7.2.4]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 1"}, out: {y: y}}
  - {id: g, type: all_good, in: {x: x}, out: {y: ok}}
calls:
  - {x: .inf, y: bad, ok: false}
  - {x: 1, y: 2, ok: true}
  - {x: .nan, y: bad, ok: false}
  - {x: -.inf, y: bad, ok: false}
