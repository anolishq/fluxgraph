# 7.7.3: the total is uncertain when the ticks it missed, and the ticks on
# which it added an uncertain input, are together more than tolerance times
# the ticks it has run.
rules: [7.7.3]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: i, type: integrate, in: {x: x}, settings: {tolerance: 0.25}, out: {y: total}}
calls:
  - {x: 1, total: 1}
  - {x: bad, total: {u: 1}}                          # 1 of 2
  - {x: 1, total: {u: 2}}                            # 1 of 3
  - {x: 1, total: 3}                                 # 1 of 4: not more than a quarter
  - {x: 1, total: 4}
  - {x: {v: 1, state: uncertain}, total: {u: 5}}     # 2 of 6
  - {x: 1, total: {u: 6}}                            # 2 of 7
  - {x: 1, total: 7}                                 # 2 of 8
