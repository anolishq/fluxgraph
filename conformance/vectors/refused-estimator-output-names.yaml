# 7.9.8: refused: an estimator two of whose outputs would have one name.
# The state sigma_x and the sigma of the state x are both sigma_x.
rules: [7.9.8]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: linear, A: [[-1, 0], [0, -1]], B: [[0], [0]], C: [[1, 0]], states: [x, sigma_x]}
      q: {x: 1, sigma_x: 1}
      p0: {x: 1, sigma_x: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
expect: compile_error
error_mentions: [k, sigma_x]
