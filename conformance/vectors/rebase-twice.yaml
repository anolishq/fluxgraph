# 8.5: a second rebase before the call does away with what was written since the first.
rules: [8.5]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
calls:
  - {now: 100, x: 1, y: 1}
  - {$rebase: true}
  - {$write: [x, good, 5.0, 1]}
  - {$rebase: true}
  - {now: 1, gap: true, y: not_ready, waiting: 0}
