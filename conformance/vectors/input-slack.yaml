# 6.10, 6.2: at a period of 0.1 s, tick 3 is at 0.30000000000000004. A
# sample taken at 0 is then a hair more than 300 ms old, within the slack,
# and is usable. A window of 0.3 s is three periods exactly.
rules: [6.10, 6.2, 7.2.1, 7.2.5]
period: 100ms
inputs: {x: {max_age: 300ms}, never: {max_age: 300ms}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
  - {id: g, type: formula, in: {n: never}, settings: {expr: "n + 0"}, out: {y: z}}
  - {id: w, type: window, in: {x: x}, settings: {window: 0.3s}, out: {count: count}}
calls:
  - {now: 0, x: {v: 1, at: 0}, y: 1, z: not_ready, count: 1}
  - {now: 0.1, y: 1, z: not_ready, count: 2}
  - {now: 0.2, y: 1, z: not_ready, count: 3}
  - {now: 0.3, y: 1, z: not_ready, count: 3}
  - {now: 0.4, y: bad, z: bad, count: 2}
