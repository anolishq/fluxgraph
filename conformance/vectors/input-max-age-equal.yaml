# 7.2.4: an age exactly equal to the maximum is usable. At a period of
# 0.1 s the times are exact: tick 3 is at 0.3 s.
rules: [7.2.4, 6.2]
period: 100ms
inputs: {x: {max_age: 300ms}, i: {max_age: 300ms, initial: 9}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
  - {id: g, type: formula, in: {i: i}, settings: {expr: "i + 0"}, out: {y: z}}
calls:
  - {now: 0, x: 1, y: 1, z: {u: 9}}
  - {now: 0.1, y: 1, z: {u: 9}}
  - {now: 0.2, y: 1, z: {u: 9}}
  - {now: 0.3, y: 1, z: {u: 9}}
  - {now: 0.4, y: bad, z: bad}
