# of 0, joined by 3 W/K, the first heated at 10 W, at a period of 5 s: half
# their own time constant. Their sum rises with a time constant of 10 s
# towards 10, and their difference with one of 10/7 s towards 10/7. (As two
# thermal_mass blocks this graph is refused; before it was, they reached
# 10^19 and said good.)
