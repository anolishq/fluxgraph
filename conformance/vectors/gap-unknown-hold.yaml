# 8.6: told that nobody knows how many ticks were passed over, held_for
# stops, with hold as with reset. Its hold_limit is 5 s. Ticks 0 to 2, a
# restore, tick 3.
rules: [8.6, 7.6.1]
period: 1s
inputs: {c: {type: boolean, max_age: none}}
blocks:
  - {id: hf, type: held_for, in: {x: c}, settings: {time: 1s, on_bad: hold, hold_limit: 5s}, out: {y: long, elapsed: fe}}
calls:
  - {c: true, long: false, fe: 1}
  - {c: true, long: false, fe: 2}
  - {c: true, long: true, fe: 3}
  - {$save: a}
  - {$restore: a}
  - {now: 50, gap: true, skipped: unknown, c: true, long: false, fe: 1}
