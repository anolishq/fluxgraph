# 7.7.15: a PID that stops following with no `track` starts from where the
# actuator last was: its integral was set while it followed, 20 less 6, and
# 6 are added. Its integral is uncertain where its setpoint is, whatever
# `track` and `follow` are; and at the tick of a reset it is zero, and is
# not set from `track`, and is uncertain where the reset is.
rules: [7.7.15, 7.7.9, 7.7.10]
period: 1s
inputs:
  sp: {max_age: none}
  pv: {max_age: none}
  tr: {max_age: none}
  f: {type: boolean, max_age: none}
  r: {type: boolean, max_age: none}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv, track: tr, follow: f, reset: r}, settings: {kp: 1, ki: 1}, out: {y: y, integral: i}}
calls:
  - {sp: 10, pv: 4, tr: 20, f: true, r: false, y: 20, i: 14}
  - {tr: bad, f: false, y: 26, i: 20}
  - {sp: {v: 10, state: uncertain}, tr: 3, f: true, y: 3, i: {u: -3}}
  - {sp: 10, r: true, y: 3, i: 0}
  - {r: false, y: 3, i: -3}
  - {r: {v: true, state: uncertain}, y: 3, i: {u: 0}}
