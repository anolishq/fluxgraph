# 7.8.1, Appendix A: the value at a tick is the state at that tick, and
# tick 0 gives the initial state. tau is 2 s; over one period z = -0.5 and
# the Runge-Kutta factor is 1 - 0.5 + 0.125 - 0.5^3/6 + 0.5^4/24.
rules: [7.8.1, 7.8.2, 7.8.3, A.thermal_mass]
period: 1s
inputs: {p: {max_age: none}, amb: {max_age: none}}
blocks:
  - {id: m, type: thermal_mass, in: {power: p, ambient: amb}, settings: {thermal_mass: 2, heat_transfer: 1, initial: 16}, out: {temp: temp}}
calls:
  - {p: 0, amb: 0, temp: 16}
  - {temp: 9.708333333333332}
  - {p: 2, temp: 5.890733506944443}          # the state at tick 2; the power acts from here
  - {temp: 4.3607836122866015}               # 2 + (5.8907... - 2) * factor
