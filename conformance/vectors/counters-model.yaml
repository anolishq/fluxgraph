# 7.8.6: a model with no settle and no memory that fades reports good, and
# counts, in seconds. elapsed counts from the first tick. doubtful counts
# the steps, before this tick, taken on an uncertain or a held value or
# not taken. The model is x' = x + u; the period and its ride_through are 500 ms.
rules: [7.8.6]
period: 500ms
inputs: {u: {max_age: none}}
blocks:
  - {id: m, type: state_space, in: {u: u}, settings: {A: [[1]], B: [1], C: [1], ride_through: 500ms}, out: {y: y, elapsed: elapsed, doubtful: doubtful}}
calls:
  - {u: 1, y: 0, elapsed: 0.5, doubtful: 0}
  - {u: bad, y: 1, elapsed: 1, doubtful: 0}         # this tick's step is on the 1 it last had
  - {u: bad, y: 2, elapsed: 1.5, doubtful: 0.5}     # this tick's is not taken
  - {u: {v: 1, state: uncertain}, y: 2, elapsed: 2, doubtful: 1}
  - {u: 1, y: 3, elapsed: 2.5, doubtful: 1.5}
  - {u: 1, y: 4, elapsed: 3, doubtful: 1.5}
