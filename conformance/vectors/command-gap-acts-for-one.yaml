# 6.13, 8.4: the tick a gap runs is the last of its call, and the only
# one: a block that acts by the call acts for one period.
rules: [6.13, 8.4]
period: 1s
max_catch_up: 3
commands: [y]
inputs: {sp: {max_age: none}, pv: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv}, settings: {kp: 0, ki: 1}, out: {y: y, integral: i}}
calls:
  - {sp: 1, pv: 0, i: 1}
  - {now: 10, gap: true, skipped: 9, i: 2}
