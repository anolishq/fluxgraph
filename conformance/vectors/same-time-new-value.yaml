# 6.8, 3.7: a write with the same time as what stands and another value
# stands in its place. A block that compares sample times does not take it
# for a new sample: the window holds one sample, the first.
rules: [6.8, 3.7, 7.3.7]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
  - {id: w, type: window, in: {x: x}, settings: {window: 3s, min_good: 0.3, only_new: true}, out: {max: hi, count: count}}
calls:
  - {now: 0, x: {v: 2, at: 0}, y: 2, hi: 2, count: 1}
  - {now: 1, x: {v: 50, at: 0}, y: 50, hi: 2, count: 1}
