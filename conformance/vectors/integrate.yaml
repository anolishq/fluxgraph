# 7.7: adds the input times the period on every usable tick. missed is the
# time not integrated. The total is uncertain once it has missed time or
# added an uncertain input, bad past max_missed, and good again after a reset.
rules: [7.7.1, 7.7.2, 7.7.3, 7.7.4, 7.7.5, A.integrate]
period: 1s
inputs: {x: {}, r: {type: boolean}}
blocks:
  - {id: i, type: integrate, in: {x: x, reset: r}, out: {y: total, missed: missed}}
  - {id: j, type: integrate, in: {x: x}, settings: {per: 1m, max_missed: 2s}, out: {y: per_min, missed: j_missed}}
calls:
  - {x: 6, r: false, total: 6, missed: 0, per_min: 0.1, j_missed: 0}
  - {x: 6, total: 12, missed: 0, per_min: 0.2}
  - {x: bad, total: {u: 12}, missed: 1, per_min: {u: 0.2}, j_missed: 1}
  - {x: {v: 6, state: uncertain}, total: {u: 18}, missed: 1, per_min: {u: 0.3}}
  - {x: bad, total: {u: 18}, missed: 2, per_min: {u: 0.3}, j_missed: 2}
  - {x: not_ready, total: {u: 18}, missed: 3, per_min: bad, j_missed: 3}
  - {x: 6, r: true, total: 6, missed: 0, per_min: bad}      # reset, then this tick's addition
  - {x: {v: 6, state: uncertain}, r: false, total: {u: 12}, missed: 0}
  - {x: 6, r: true, total: 6, missed: 0}
  - {x: 6, r: bad, total: 12, missed: 0}                    # an unusable reset does nothing
