# 6.11, 8.5: a rebase whose length would give the tick it runs a number
# past 64 bits is accepted, and the call after it is refused, as is every
# call until the host calls rebase again with a length that does not.
rules: [6.11, 8.5]
period: 1ns
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 1"}, out: {y: y}}
calls:
  - {now: 0, x: 1, y: 2}
  - {now: "0.000000001", y: 2}
  - {$rebase: "9223372036.854775807"}   # 2 + (2^63 - 1) - 1 is 2^63
  - {now: "0.000000001", refused: true}
  - {now: "0.000000002", refused: true}
  - {$rebase: 0}
  - {now: "0.000000005", gap: true, skipped: 0, tick: 2, x: 1, y: 2}
