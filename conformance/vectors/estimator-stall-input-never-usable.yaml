# 7.9.9, 7.9.2: with a model input never usable the state stays and the
# covariance is P + N, at each of the predictions for ticks passed over as
# at any other. From a variance of 1 with q of 1, 99 ticks passed over and
# the tick that runs add 100: a sigma of the root of 101.
rules: [7.9.9, 7.9.2, 8.6]
period: 1s
max_catch_up: 1
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[0.5]], B: [1], C: [1], initial: [3]}
      q: {x0: 1}
      p0: {x0: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
    out: {x0: x, sigma_x0: sigma}
calls:
  - {now: 0, x: 3, sigma: 1}
  - {now: 100, gap: true, skipped: 99, x: {u: 3}, sigma: {u: 10.04987562112089}}
