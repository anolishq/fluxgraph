# 8.2, 6.13: the tick after a restore is the last of its call: a PID that
# acts by the call acts for one period, and after a gap of no known
# length waits to track.
rules: [8.2, 6.13, 7.7.14]
period: 1s
commands: [y]
inputs: {sp: {max_age: none}, pv: {max_age: none}, tr: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv, track: tr}, settings: {kp: 0, ki: 1}, out: {y: y, integral: i}}
calls:
  - {now: 0, sp: 1, pv: 0, tr: bad, y: 1, i: 1}
  - {$save: a}
  - {now: 1, y: 2, i: 2}
  - {$restore: a}
  - {now: 50, gap: true, skipped: unknown, sp: 1, pv: 0, tr: 10, y: 11, i: 11}
