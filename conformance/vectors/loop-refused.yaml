# 5.3: a dependency loop is refused, and the refusal names the blocks on it.
rules: [5.3]
period: 1s
blocks:
  - {id: p, type: formula, in: {q: q_out}, settings: {expr: q + 1}, out: {y: p_out}}
  - {id: q, type: formula, in: {p: p_out}, settings: {expr: p + 1}, out: {y: q_out}}
expect: compile_error
error_mentions: [p, q]
