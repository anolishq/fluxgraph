# 7.4, 6.2: the same total at half-second ticks. A block is given the period.
rules: [7.4, 6.2]
period: 500ms
inputs: {x: {}}
blocks:
  - {id: t, type: total, in: {x: x}, out: {y: sum, missed: missed}}
ticks:
  - {x: 2, sum: 1, missed: 0}
  - {x: 2, sum: 2, missed: 0}
  - {x: bad, sum: 2, missed: 0.5}
  - {x: 2, sum: 3, missed: 0.5}
