# 7.9.5: an innovation that is exactly gate times the root of the spread is
# not over the gate. Variance 3, r 1, gate 2: 4 against 2 * 2.
rules: [7.9.5]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[1]], B: [0], C: [1]}
      q: {x0: 0}
      p0: {x0: 3}
      measure: {z: {of: y, r: 1}}
      consistency: none
      gate: 2
      max_refused: 5
    out: {x0: x, refused_z: rejected}
calls:
  - {u: 0, z: 4, x: 3, rejected: 0}
