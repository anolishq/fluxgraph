# 7.8.8: refused: every model block on a loop is given settle, and the
# second here is not. Off a loop its settle would be three of its tau, 3 s,
# which is what the first states: that is not the author's statement.
rules: [7.8.8]
period: 1s
inputs: {sp: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: second.y}, settings: {kp: 1}}
  - {id: first, type: state_space, in: {u: c.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 3s}}
  - {id: second, type: first_order_process, in: {u: first.y}, settings: {tau: 1s}}
expect: compile_error
error_mentions: [settle]
