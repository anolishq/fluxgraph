# 7.7.14: at the tick of a reset the integral is zero before the tick's
# addition, whatever track says, and the PID has stopped waiting.
rules: [7.7.14, 7.7.10]
period: 1s
inputs: {sp: {max_age: none}, pv: {max_age: none}, tr: {max_age: none}, r: {type: boolean, max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv, track: tr, reset: r}, settings: {kp: 1, ki: 1}, out: {y: y, integral: i}}
calls:
  - {sp: 10, pv: 4, tr: 20, r: true, y: 12, i: 6}
  - {r: false, y: 18, i: 12}
