# 7.9.2: a model input has each value from its own place, over as many
# ticks as the state stands behind. The model is x' = u with no noise, and
# u is written anew in the middle of every period: 1 from 0, 2 from 0.5 s,
# 3 from 1.5 s and so on. With no measurement after tick 0 the state stands
# at tick 0 until it is more than two periods behind, and what is given at
# each tick is carried over every value in turn: half a period on each side
# of a change. The last sample, at 5.75 s, is met by a state carried there.
rules: [7.9.2, 7.9.8]
period: 1s
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 0}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 1, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- $write: [u, good, 2, 0.5]
- {now: 1, x: 1.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- $write: [u, good, 3, 1.5]
- {now: 2, x: 3.5, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- $write: [u, good, 4, 2.5]
- {now: 3, x: 7.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- $write: [u, good, 5, 3.5]
- {now: 4, x: 11.5, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- $write: [u, good, 6, 4.5]
- {now: 5, x: 17.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- $write: [u, good, 7, 5.5]
- now: 6
  z: {v: 20, at: 5.75}
  x: 22.833333333333332
  sigma: 0.5773502691896258
  innovation: -2.0
  late: 0.0
- {now: 7, x: 30.083333333333332, sigma: 0.5773502691896258, innovation: not_ready, late: 0.0}
