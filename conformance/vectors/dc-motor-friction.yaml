# Appendix A: a motor with nothing at 1. R 5, L 2, back_emf 0.75,
# torque_constant 1, J 0.5, friction 0.25: the rates are -1 and -2 again.
# From rest with 2 V the speed is 1 - 2 e^-t + e^-2t, and the current is
# J (its rate of change) + friction (the speed), over the torque constant.
rules: [7.8.7, A.dc_motor]
period: 1s
inputs: {v: {max_age: none}, load: {max_age: none}}
blocks:
  - {id: m, type: dc_motor, in: {voltage: v, load_torque: load}, settings: {resistance: 5, inductance: 2, back_emf: 0.75, torque_constant: 1, inertia: 0.5, friction: 0.25}, out: {speed: w, current: i}}
calls:
  - {v: 2, load: 0, w: 0, i: 0}
  - {v: 2, load: 0, w: 0.39957640089372803, i: 0.33243825815826167}
  - {v: 2, load: 0, w: 0.7476450724155088, i: 0.30393091245175574}
