# 7.9.5: the gate is against the root of the spread, which is the state's
# variance and the measurement's together. x' = x from 0, variance 3, r 1,
# gate 2: an innovation of 3 is within 2 * root 4, and is used, though it
# is over 2 * root 1. The gain is 3/4.
rules: [7.9.5, 7.9.4]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[1]], B: [0], C: [1]}
      q: {x0: 0}
      p0: {x0: 3}
      measure: {z: {of: y, r: 1}}
      consistency: none
      gate: 2
      max_refused: 5
    out: {x0: x, sigma_x0: sigma, refused_z: rejected}
calls:
  - {u: 0, z: 3, x: 2.25, sigma: 0.8660254037844386, rejected: 0}
