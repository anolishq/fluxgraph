# 7.2.3, 7.2.5: an input has the state the host wrote. A write of not_ready
# has no sample and does not grow old.
rules: [7.2.2, 7.2.5]
period: 1s
inputs: {x: {max_age: 1s}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 1"}, out: {y: y}}
calls:
  - {x: {v: 4, state: uncertain}, y: {u: 5}}
  - {x: bad, y: bad}
  - {x: 4, y: 5}
  - {x: not_ready, y: not_ready}
  - {y: not_ready}
  - {y: not_ready}
  - {y: not_ready}
