# 7.7.13, 7.7.6: the addition of a call's last tick is cut short as any
# other. Three periods' worth would take the output to 6, past a max of 5.
rules: [7.7.13, 7.7.6]
period: 1s
commands: [y]
inputs: {sp: {max_age: none}, pv: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv}, settings: {kp: 0, ki: 1, max: 5}, out: {y: y, integral: i, limited: lim}}
calls:
  - {sp: 1, pv: 0, y: 1, i: 1, lim: false}
  - {now: 2, ran: 2, y: 3, i: 3, lim: false}
  - {now: 5, ran: 3, y: 5, i: 5, lim: true}
