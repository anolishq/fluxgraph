# 7.1.5: the rules apply to each operation in turn. The `or` is decided by a
# and comes out good, so b being bad does not reach the `and`.
rules: [7.1.5, 7.1.1]
period: 1s
inputs: {a: {type: boolean, max_age: none}, b: {type: boolean, max_age: none}, c: {type: boolean, max_age: none}}
blocks:
  - {id: f, type: formula, in: {a: a, b: b, c: c}, settings: {expr: "(a or b) and c"}, out: {y: y}}
  - {id: g, type: formula, in: {a: a}, settings: {expr: "not a"}, out: {y: na}}
calls:
  - {a: true, b: bad, c: true, y: true, na: false}
  - {a: false, b: bad, c: true, y: bad, na: true}
  - {a: false, b: bad, c: false, y: false, na: true}
  - {a: {v: true, state: uncertain}, b: bad, c: true, y: {u: true}, na: {u: false}}
  - {a: bad, b: true, c: true, y: true, na: bad}
