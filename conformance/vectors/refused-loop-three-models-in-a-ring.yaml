# 7.8.8: refused: three model blocks in a ring, each taking the next's
# output, one of them through a formula. No two take each other's.
rules: [7.8.8]
period: 1s
inputs: {p: {max_age: none}}
blocks:
  - {id: g, type: formula, in: {x: c.y, p: p}, settings: {expr: "x + p"}}
  - {id: a, type: state_space, in: {u: g.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
  - {id: b, type: state_space, in: {u: a.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
  - {id: c, type: state_space, in: {u: b.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
expect: compile_error
error_mentions: [a, b, c, one]
