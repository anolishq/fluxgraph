# 6.9, 6.10, 8.3, 8.4: a call that would run more ticks than max_catch_up
# is a stall. One tick runs: the last that was due, under its own number.
# What stood goes on standing, and the call says it was a gap and how
# many ticks it passed over.
rules: [6.9, 6.10, 8.3, 8.4]
period: 1s
max_catch_up: 3
inputs: {x: {max_age: none}, quiet: {max_age: none}, never: {max_age: 2s}, slow: {max_age: 8s}}
blocks:
  - {id: i, type: integrate, in: {x: x}, out: {y: total}}
  - {id: f, type: formula, in: {q: quiet}, settings: {expr: "q + 0"}, out: {y: q}}
  - {id: g, type: formula, in: {n: never}, settings: {expr: "n + 0"}, out: {y: v}}
  - {id: h, type: formula, in: {n: slow}, settings: {expr: "n + 0"}, out: {y: s}}
  - {id: n, type: integrate, in: {x: 1}, out: {y: ticks}}
calls:
  - {now: 0, x: 2, quiet: 7, total: 2, q: 7, v: not_ready, ticks: 1}
  - {now: 1, x: 2, total: 4, q: 7, v: not_ready, ticks: 2}
  - {now: 4, ran: 3, x: 2, total: 10, q: 7, v: bad, s: not_ready, ticks: 5}         # three ticks: not a gap
  # six would be due: a stall. tick 10 runs, the last due, and five are passed over. the write waiting is
  # taken up. `slow` has gone unwritten for 10 s, counted from tick 0, which the stall does not move.
  - {now: 10.2, ran: 1, gap: true, skipped: 5, tick: 10, time: 10, x: {v: 5, at: 10.1}, total: 15, q: 7, v: bad, s: bad, ticks: 6}
  - {now: 11, skipped: 0, tick: 11, time: 11, total: 20, q: 7, v: bad, s: bad, ticks: 7}   # later ticks follow at whole periods
  - {now: 11.4, ran: 0}
