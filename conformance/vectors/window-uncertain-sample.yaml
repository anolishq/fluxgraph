# 7.3.4, 7.3.5: with min_good of 1 a window of two needs two good samples.
# With two usable and one of them uncertain it is uncertain.
rules: [7.3.4]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: w, type: window, in: {x: x}, settings: {window: 2s}, out: {mean: mean}}
calls:
  - {x: 1, mean: not_ready}
  - {x: {v: 3, state: uncertain}, mean: {u: 2}}
  - {x: 5, mean: {u: 4}}
  - {x: 7, mean: 6}
