# 5.3, 4.3: refused: a loop through a model whose input is direct.
rules: [5.3, 4.3]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: plant, type: state_space, in: {u: ctl.y}, settings: {A: [[0.5]], B: [0.5], C: [1], D: 1}}
  - {id: ctl, type: formula, in: {r: r, y: plant.y}, settings: {expr: "r - y"}}
expect: compile_error
error_mentions: [plant, ctl]
