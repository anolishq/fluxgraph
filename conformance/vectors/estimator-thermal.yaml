# 7.9.2, Appendix A: an estimator over a thermal mass uses the model's
# sensitivity: 0.6067708333333333 over one period of 1 s at tau 2 s. No
# measurement is written, so this is prediction alone: from 16 with
# variance 1, q 0. The variance is multiplied by the factor squared each tick.
rules: [7.9.2, A.thermal_mass]
period: 1s
inputs: {p: {max_age: none}, amb: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {power: p, ambient: amb, z: z}
    settings:
      model: {type: thermal_mass, thermal_mass: 2, heat_transfer: 1, initial: 16}
      q: {temp: 0}
      p0: {temp: 1}
      measure: {z: {of: temp, r: 1}}
    out: {temp: temp, sigma_temp: sigma}
calls:
  - {p: 0, amb: 0, temp: 16, sigma: 1}
  - {temp: 9.708333333333332, sigma: 0.6067708333333333}
  - {temp: 5.890733506944443, sigma: 0.3681708441840277}
