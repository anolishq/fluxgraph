# 7.7.6: an addition towards the other limit is made whole, though the
# output is past a limit with it made. With kp of -2 an error of -10 puts
# the rest at 20, above max, while the addition is -10. The second block
# has its inputs the other way round, and a min.
rules: [7.7.6, 7.7.9]
period: 1s
inputs: {sp: {max_age: none}, pv: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv}, settings: {kp: -2, ki: 1, max: 3}, out: {y: y, integral: i, limited: lim}}
  - {id: d, type: pid, in: {setpoint: pv, measurement: sp}, settings: {kp: -2, ki: 1, min: -3}, out: {y: low, integral: j, limited: lim_low}}
calls:
  - {sp: 0, pv: 10, y: 3, i: -10, lim: true, low: -3, j: 10, lim_low: true}
  - {y: 0, i: -20, lim: false, low: 0, j: 20, lim_low: false}
