# 7.4.12: a rate limit that acts by the call forgets nothing at a catch-up
# tick. The input is bad from 1 s and 20 from 3 s, and the ride_through is
# 1 s. Ticks 1 and 2 are catch-up ticks: at tick 3 it still holds 10, and
# moves three periods' reach.
rules: [7.4.12]
period: 1s
commands: [y]
inputs: {x: {max_age: none}}
blocks:
  - {id: r, type: rate_limit, in: {x: x}, settings: {up: 2, ride_through: 1s}, out: {y: y, limited: lim}}
calls:
  - {now: 0, x: 10, y: 10, lim: false}
  - {$write: [x, bad, null, 1]}
  - {now: 3, ran: 3, x: {v: 20, at: 3}, y: 16, lim: true}
