# 8.2, 7.9.2: a save holds the values a model input has from later places,
# and the places. u is 1 from tick 0 and 3 from 0.75 s, place 12, and the
# state stands at tick 0 when the state is saved after tick 1. Restored,
# the rebase carries it to tick 1: twelve sixteenths on 1 and four on 3, to
# 1.5; and from there on 3.
rules: [8.2, 7.9.2, 7.9.9]
period: 1s
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 0}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 1, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- $write: [u, good, 3, 0.75]
- {now: 1, x: 1.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- {$save: a}
- {now: 2, x: 4.5, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- {$restore: a}
- now: 9
  gap: true
  x: {u: 4.5}
  sigma: {u: 1.224744871391589}
  innovation: not_ready
  late: 0.0
- now: 10
  x: {u: 7.5}
  sigma: {u: 1.224744871391589}
  innovation: not_ready
  late: 0.0
