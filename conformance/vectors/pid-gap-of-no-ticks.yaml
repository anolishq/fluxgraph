# 8.5, 7.7.7: a rebase forgets every sample time, the one a PID's
# derivative remembers among them, and the derivative starts again, where
# the rebase passed over no tick too. The clock after it reads less than
# the clock before: a derivative that went on would wait for a sample
# later than 101 s. The gap is counted.
rules: [8.5, 8.6, 7.7.7]
period: 1s
inputs: {sp: {max_age: none}, pv: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv}, settings: {kp: 0, kd: 2, filter: 1s}, out: {y: y, gaps: gaps}}
calls:
  - {now: 100, sp: 0, pv: 0, y: 0, gaps: 0}
  - {now: 101, pv: 1, y: -1.2642411176571153, gaps: 0}
  - {$rebase: 0}
  - {now: 5, gap: true, skipped: 0, tick: 2, sp: 0, pv: 1, y: 0, gaps: 1}
  - {now: 6, pv: 2, y: -1.2642411176571153, gaps: 1}
