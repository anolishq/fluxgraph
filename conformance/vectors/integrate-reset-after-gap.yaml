# 7.7.5, 8.4: after a gap a total is uncertain until its next reset.
rules: [7.7.5, 8.4]
period: 1s
inputs: {x: {max_age: none}, r: {type: boolean, max_age: none}}
blocks:
  - {id: i, type: integrate, in: {x: x, reset: r}, out: {y: total}}
calls:
  - {x: 1, r: false, total: 1}
  - {$save: a}
  - {$restore: a}
  - {now: 10, gap: true, x: 1, r: false, total: {u: 2}}
  - {now: 11, x: 1, r: true, total: 1}
