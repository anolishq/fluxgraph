# 7.8.8: refused: two model blocks that read each other.
rules: [7.8.8]
period: 1s
inputs: {p: {max_age: none}, a: {max_age: none}}
blocks:
  - {id: pad, type: thermal_mass, in: {power: p, ambient: liq.temp}, settings: {thermal_mass: 10, heat_transfer: 3, initial: 0, settle: 2s}}
  - {id: liq, type: thermal_mass, in: {power: 0, ambient: pad.temp}, settings: {thermal_mass: 10, heat_transfer: 3, initial: 0, settle: 2s}}
expect: compile_error
error_mentions: [pad, liq, one]
