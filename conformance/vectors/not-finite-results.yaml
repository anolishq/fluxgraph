# 7.7: an input that is not finite is unusable even where arithmetic on it
# would give an ordinary answer. 7.1.4: a result that is not finite is bad.
rules: [7.1.4, 7.7]
period: 1s
inputs: {a: {}, b: {}}
blocks:
  - {id: c, type: formula, in: {a: a}, settings: {expr: a > 0}, out: {y: positive}}
  - {id: m, type: formula, in: {a: a, b: b}, settings: {expr: a * b}, out: {y: product}}
ticks:
  - {a: 2, b: 3, positive: true, product: 6}
  - {a: .nan, b: 3, positive: bad, product: bad}
  - {a: .inf, b: 3, positive: bad, product: bad}
  - {a: 1.0e+308, b: 10, positive: true, product: bad}   # overflows
  - {a: -1, b: 3, positive: false, product: -3}
