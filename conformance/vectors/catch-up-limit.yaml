# 6.9: a call that would run exactly max_catch_up ticks runs them, and is not a gap.
rules: [6.9, 8.4]
period: 1s
max_catch_up: 3
blocks:
  - {id: i, type: integrate, in: {x: 1}, out: {y: n}}
calls:
  - {now: 0, n: 1}
  - {now: 3, ran: 3, n: 4}
  - {now: 7, ran: 1, gap: true, skipped: 3, tick: 7, time: 7, n: 5}
