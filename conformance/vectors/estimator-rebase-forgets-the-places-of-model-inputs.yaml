# 7.9.9: after a rebase each model input has the value it last had from the
# place the state stands at. At tick 1, called at 1.3125 s, u is 4 from
# place 21, and the state stands at tick 1's place, 16, on a sample taken
# there. After the rebase tick 2 is given carried from 16 on 4 throughout:
# x rises by 4, where a value kept at place 21 would leave 5 sixteenths on
# the old u of 0.
rules: [7.9.9, 7.9.2]
period: 1s
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 0}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 0, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- $write: [z, good, 0, 1]
- $write: [u, good, 4, 1.3125]
- {now: 1.3125, x: 0.0, sigma: 0.5773502691896258, innovation: 0.0, late: 0.0}
- {$rebase: true}
- now: 7
  gap: true
  x: {u: 4.0}
  sigma: {u: 1.1547005383792517}
  innovation: not_ready
  late: 0.0
