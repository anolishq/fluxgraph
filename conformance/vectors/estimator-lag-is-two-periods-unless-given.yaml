# 7.9.2: `lag` is two periods unless given. The model is x' = u with no
# noise. At tick 5 the state is carried to tick 3, and a sample taken at
# 2.5 s is before that: late, where a lag of three periods would take it.
# At tick 6 the state is carried to tick 4, and a sample taken at 4.5 s is
# after that: considered, where a lag of one period would pass it by.
rules: [7.9.2, 7.9.3]
period: 1s
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 0}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 0, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- {now: 1, x: 0.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- {now: 2, x: 0.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- {now: 3, x: 0.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- {now: 4, x: 0.0, sigma: 0.7071067811865476, innovation: not_ready, late: 0.0}
- now: 5
  z: {v: 5, at: 2.5}
  x: {u: 0.0}
  sigma: {u: 0.7071067811865476}
  innovation: not_ready
  late: 1.0
- now: 6
  z: {v: 2, at: 4.5}
  x: 0.6666666666666666
  sigma: 0.5773502691896258
  innovation: 2.0
  late: 1.0
