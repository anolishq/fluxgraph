# 7.9.7: sigma_max makes its own state uncertain and no other. Two states
# that do not move, with variances of 1 and 9; x1 may have a sigma of 2.
rules: [7.9.7]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[1, 0], [0, 1]], B: [0, 0], C: [1, 0]}
      q: {x0: 0, x1: 0}
      p0: {x0: 1, x1: 9}
      measure: {z: {of: y, r: 1}}
      consistency: none
      sigma_max: {x1: 2}
    out: {x0: a, x1: b}
calls:
  - {u: 0, a: 0, b: {u: 0}}
