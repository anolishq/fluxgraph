# 7.9.3: a measurement carries the time of a sample, through any number of
# delays and formulas, from an input. A delay of a constant carries none:
# refused, as a constant on the port itself is.
rules: [7.9.3]
period: 1s
blocks:
  - {id: d, type: delay, in: {x: 5}}
  - id: k
    type: estimator
    in: {u: 0, z: d.y}
    settings: {model: {type: state_space, A: [[1]], B: [0], C: [1]}, q: {x0: 0}, p0: {x0: 1}, measure: {z: {of: y, r: 1}}, consistency: none}
expect: compile_error
error_mentions: [k]
