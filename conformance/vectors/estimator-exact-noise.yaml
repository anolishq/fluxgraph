# 7.9.2: for a model in continuous time the process noise is exact. A
# thermal mass with a rate of 1 a second and q of 2: over a period it adds
# 1 - e^-2 and what was there falls by e^-2, so the variance tends to 1.
# From 4: 1 + 3 e^-2, then 1 + 3 e^-4. The second loses 3 W/K, a rate of 3,
# and has q of 6: 1 + 3 e^-6, then 1 + 3 e^-12. No measurement is written.
rules: [7.9.2, 7.8.7]
period: 1s
inputs: {p: {max_age: none}, a: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {power: p, ambient: a, z: z}
    settings:
      model: {type: thermal_mass, thermal_mass: 1, heat_transfer: 1, initial: 0}
      q: {temp: 2}
      p0: {temp: 4}
      measure: {z: {of: temp, r: 1}}
      consistency: none
    out: {sigma_temp: sigma}
  - id: f
    type: estimator
    in: {power: p, ambient: a, z: z}
    settings:
      model: {type: thermal_mass, thermal_mass: 1, heat_transfer: 3, initial: 0}
      q: {temp: 6}
      p0: {temp: 4}
      measure: {z: {of: temp, r: 1}}
      consistency: none
    out: {sigma_temp: fast}
calls:
  - {p: 0, a: 0, sigma: 2, fast: 2}
  - {sigma: 1.1857511752934669, fast: 1.0037112416078635}
  - {sigma: 1.0271060883210665, fast: 1.00000921627606}
