# Appendix A: the names in each of a linear block's lists are distinct. Two
# inputs of one name are refused.
rules: [A.linear]
period: 1s
inputs: {u: {max_age: none}}
blocks:
  - {id: m, type: linear, in: {u: u}, settings: {A: [[-1]], B: [[1, 1]], C: [[1]], inputs: [u, u]}}
expect: compile_error
error_mentions: [inputs]
