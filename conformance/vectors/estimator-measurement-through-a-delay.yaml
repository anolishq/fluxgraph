# 7.9.3, 3.7, 8.5: a measurement may be read through a delay and a formula
# of one signal, which carry its sample time on. x' = x from 0, variance
# 1, r 1; the measurement is twice the input of a tick ago. Tick 0: the
# delay has nothing. Tick 1: 2, stamped 0: used, gain 1/2. Tick 2: the
# same sample again, and not considered. A rebase that passes over no
# tick: the variance grows by p0, and what the delay holds loses its
# time. Tick 3: a value with no sample time is not considered. Tick 4:
# 6, stamped on the new clock: the spread is 5/2 and the gain 3/5.
rules: [7.9.3, 3.7, 8.5]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - {id: d, type: delay, in: {x: z}}
  - {id: f, type: formula, in: {x: d.y}, settings: {expr: "x * 2"}}
  - id: k
    type: estimator
    in: {u: u, z: f.y}
    settings:
      model: {type: state_space, A: [[1]], B: [0], C: [1]}
      q: {x0: 0}
      p0: {x0: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
    out: {x0: x, innovation_z: innovation}
calls:
  - {now: 0, u: 0, z: 1, x: 0, innovation: not_ready}
  - {now: 1, x: 1, innovation: 2}
  - {now: 2, x: 1, innovation: not_ready}
  - {$rebase: 0}
  - {now: 100, gap: true, skipped: 0, u: 0, z: 3, x: 1, innovation: not_ready}
  - {now: 101, x: 4, innovation: 5}
