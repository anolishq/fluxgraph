# 7.9.9: told of a stall an estimator does nothing then, and its state is
# carried when the next tick asks: to `lag` behind it. The call at 10 s is
# a stall that runs tick 10. The state is carried to tick 8, and a sample
# taken at 8.5 s is after that: considered, where a state carried to tick 9
# when the gap was told would pass it by as late.
rules: [7.9.9, 7.9.2, 8.6]
period: 1s
max_catch_up: 2
inputs:
  u: {max_age: none}
  z: {max_age: none}
blocks:
- id: k
  type: estimator
  in: {u: u, z: z}
  settings:
    model:
      type: linear
      A:
      - [0]
      B:
      - [1]
      C:
      - [1]
    q: {x0: 0}
    p0: {x0: 1}
    measure:
      z: {of: y, r: 1}
    consistency: none
  out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
- {now: 0, u: 1, z: 0, x: 0.0, sigma: 0.7071067811865476, innovation: 0.0, late: 0.0}
- now: 10
  z: {v: 9, at: 8.5}
  gap: true
  x: {u: 10.166666666666666}
  sigma: {u: 0.5773502691896258}
  innovation: 0.5
  late: 0.0
