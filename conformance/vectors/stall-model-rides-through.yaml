# 8.6, 7.8.4: at a stall a model steps on what it held for each tick passed
# over that is within ride_through of its last usable input, and takes no
# step for the rest. The model is x' = x + u with a ride_through of 2 s and
# no settle. Ticks 0 and 1, then ticks 2 to 4 are passed over: it steps for
# 2 and 3, and not for 4. Its input is bad from tick 5, too long after
# tick 1 to ride through. doubtful counts all three, and then tick 5.
rules: [8.6, 7.8.4, 7.8.6]
period: 1s
max_catch_up: 1
inputs: {u: {max_age: none}}
blocks:
  - {id: m, type: state_space, in: {u: u}, settings: {A: [[1]], B: [1], C: [1], ride_through: 2s}, out: {y: y, doubtful: md}}
calls:
  - {now: 0, u: 1, y: 0, md: 0}
  - {now: 1, u: 1, y: 1, md: 0}
  - {now: 5, gap: true, skipped: 3, u: bad, y: 4, md: 3}
  - {now: 6, u: bad, y: 4, md: 4}
