# 7.5: true at or above rise, false at or below fall, unchanged between.
# not_ready until a threshold has been met. An unusable input changes nothing.
rules: [7.5.1, 7.5.2, 7.5.3]
period: 1s
inputs: {x: {}}
blocks:
  - {id: h, type: hysteresis, in: {x: x}, settings: {rise: 10, fall: 5}, out: {y: y}}
calls:
  - {x: bad, y: bad}                # an unusable input shows, before any threshold too
  - {x: 7, y: not_ready}
  - {x: 10, y: true}
  - {x: 7, y: true}
  - {x: 5, y: false}
  - {x: 7, y: false}
  - {x: bad, y: bad}
  - {x: 7, y: false}
  - {x: {v: 12, state: uncertain}, y: {u: true}}
  - {x: not_ready, y: not_ready}
  - {x: 7, y: true}
