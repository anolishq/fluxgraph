# 5.1: a block gives its outputs after every block it reads directly,
# whatever order they are declared in.
rules: [5.1]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: b, type: formula, in: {p: a.y}, settings: {expr: "p + 1"}, out: {y: y}}
  - {id: a, type: formula, in: {x: x}, settings: {expr: "x * 2"}}
calls:
  - {x: 3, y: 7}
  - {x: 5, y: 11}
