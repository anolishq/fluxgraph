# 7.7.6: with max alone nothing stops the integral going down.
rules: [7.7.6]
period: 1s
inputs: {sp: {max_age: none}, pv: {max_age: none}}
blocks:
  - {id: c, type: pid, in: {setpoint: sp, measurement: pv}, settings: {kp: 0, ki: 1, max: 3}, out: {y: y, integral: i, limited: lim}}
calls:
  - {sp: 2, pv: 0, y: 2, i: 2, lim: false}
  - {y: 3, i: 3, lim: true}
  - {sp: -50, y: -47, i: -47, lim: false}
