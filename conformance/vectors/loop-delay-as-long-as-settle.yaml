# 7.8.8: a loop whose delays add up to exactly its settle is accepted.
rules: [7.8.8]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: plant, type: state_space, in: {u: i}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 1s}, out: {y: y}}
  - {id: acc, type: delay, in: {x: i}, settings: {initial: 0}}
  - {id: ctl, type: formula, in: {p: acc.y, r: r, y: plant.y}, settings: {expr: "p + (r - y)"}, out: {y: i}}
calls:
  - {r: 2, y: 0, i: 2}
  - {r: 2, y: 1, i: 3}
  - {r: 2, y: 2, i: 3}
