# 7.8.8: refused: through formulas alone is through any number of them, in
# both directions here.
rules: [7.8.8]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: e, type: formula, in: {r: r, y: second.y}, settings: {expr: "r - y"}}
  - {id: g, type: formula, in: {x: e.y}, settings: {expr: "2 * x"}}
  - {id: h, type: formula, in: {x: first.y}, settings: {expr: "x / 2"}}
  - {id: first, type: state_space, in: {u: g.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
  - {id: second, type: state_space, in: {u: h.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
expect: compile_error
error_mentions: [first, second, one]
