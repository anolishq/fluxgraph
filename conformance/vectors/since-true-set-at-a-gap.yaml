# 8.6, 7.6.2: a clock set on the tick a gap runs counts from that tick, and
# its gaps is one.
rules: [8.6, 7.6.2]
period: 1s
max_catch_up: 1
inputs: {x: {type: boolean, max_age: none}}
blocks:
  - {id: s, type: since_true, in: {x: x}, settings: {time: 3s, on_bad: assume_false}, out: {y: y, elapsed: elapsed, doubtful: doubtful, gaps: gaps}}
calls:
  - {now: 0, x: false, y: false, elapsed: 1, doubtful: 0, gaps: 0}
  - {now: 3, gap: true, skipped: 2, x: true, y: false, elapsed: 1, doubtful: 0, gaps: 1}
  - {now: 4, x: false, y: false, elapsed: 2, doubtful: 0, gaps: 1}
