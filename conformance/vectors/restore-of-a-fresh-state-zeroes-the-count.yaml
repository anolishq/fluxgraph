# 8.3, 6.8: restoring a state saved before any tick had run is a reset, and sets the count of writes
# thrown away to zero as a reset does. A restore of any other state leaves the count as it is.
rules: [8.3, 6.8]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
calls:
  - {$save: start}
  - {now: 0, x: 5.0, tick: 0, y: 5.0, thrown: 0}
  - {$save: later}
  - {$write: [x, good, 1.0, -1]}
  - {$restore: later}
  - {$write: [x, good, 6.0, 1]}
  - {now: 1, tick: 1, y: 6.0, gap: true, skipped: unknown, thrown: 1}
  - {$write: [x, good, 1.0, 0]}
  - {$restore: start}
  - {$write: [x, good, 7.0, 0]}
  - {now: 0, tick: 0, y: 7.0, thrown: 0}
