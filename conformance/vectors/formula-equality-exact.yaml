# 7.1.6: == and != compare exactly. 0.5 * 3 is exactly 1.5. 0.1 * 3 is not
# exactly 0.3 in binary, and a comparison with a tolerance would call it equal.
rules: [7.1.6]
period: 1s
inputs: {x: {}, y: {}, b: {type: boolean}}
blocks:
  - {id: eq, type: formula, in: {x: x, y: y}, settings: {expr: "x * 3 == y"}, out: {y: eq}}
  - {id: ne, type: formula, in: {x: x, y: y}, settings: {expr: "x * 3 != y"}, out: {y: ne}}
  - {id: bb, type: formula, in: {x: x, b: b}, settings: {expr: "(x > 0.25) == b"}, out: {y: bb}}
calls:
  - {x: 0.5, y: 1.5, b: true, eq: true, ne: false, bb: true}
  - {x: 0.1, y: 0.3, b: true, eq: false, ne: true, bb: false}
