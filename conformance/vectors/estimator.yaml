# 7.9: an estimator over the model x' = 0.5 x + u, starting at 8 with
# variance 4. q is 1 per second, r is 1, the gate is 3 sigmas, and a state
# is uncertain above a sigma of 1.5. Worked by hand from rules 7.9.2 and 7.9.4.
rules: [7.9.1, 7.9.2, 7.9.3, 7.9.4, 7.9.5, 7.9.6, 8.5, 8.6]
period: 1s
inputs: {u: {max_age: none}, z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: u, z: z}
    settings:
      model: {type: state_space, A: [[0.5]], B: [1], C: [1], initial: [8]}
      q: {x0: 1}
      p0: {x0: 4}
      measure: {z: {of: x0, r: 1}}
      gate: 3
      sigma_max: {x0: 1.5}
    out: {x0: x, sigma_x0: sigma, innovation_z: innovation, refused_z: rejected, since_z: since}
calls:
  # tick 0: the prior. sigma 2 is over the limit.
  - {u: 0, x: {u: 8}, sigma: {u: 2}, innovation: not_ready, rejected: 0, since: not_ready}
  # tick 1: predict to 4 on tick 0's input, variance 2. innovation -1, spread 3: used. gain 2/3.
  - {u: 0, z: 3, x: 3.3333333333333335, sigma: 0.816496580927726, innovation: -1, rejected: 0, since: 0}
  # tick 2: the same sample written again is not considered. predict only.
  - {z: {v: 3, at: 1}, x: 1.6666666666666667, sigma: 1.0801234497346435, innovation: not_ready, since: 1}
  # tick 3: predict to 0.8333, variance 1.2917. innovation 19.17 against 3 * 1.514: refused.
  - {z: 20, x: 0.8333333333333334, sigma: 1.136515141415488, innovation: 19.166666666666668, rejected: 1, since: 2}
  # tick 4: the model input is bad now. the step is on tick 3's input. an uncertain measurement is not considered.
  - {u: bad, z: {v: 1, state: uncertain}, x: {u: 0.4166666666666667}, sigma: {u: 1.1501811451535218}, innovation: not_ready, since: 3}
  # tick 5: the step is on the 0 that tick 4 last had, not the 2 written now: predict to 0.2083,
  # variance 1.3307. innovation 0.7917, spread 2.3307: used.
  - {u: 2, z: {v: 1, at: 4.5}, x: 0.6603351955307262, sigma: 0.7556121496312715, innovation: 0.7916666666666666, rejected: 1, since: 0.5}
  - {$save: a}
  - {$restore: a}
  # tick 6, a rebase: the variance grows by 4 first, then predict, on tick 5's input of 2. nothing
  # stands on z, and the time of the measurement last used is forgotten. the clock here starts again.
  - {now: 3, gap: true, tick: 6, time: 3, u: 2, x: 2.330167597765363, sigma: 1.463809219183838, innovation: not_ready, rejected: 1, since: not_ready}
  # a measurement stamped earlier than the one last considered before the rebase is considered
  - {now: 4, u: 2, z: {v: 3.165083798882682, at: 3.5}, x: 3.165083798882682, innovation: 0, since: 0.5}
