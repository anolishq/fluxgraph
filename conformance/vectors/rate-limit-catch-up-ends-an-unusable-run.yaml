# 7.4.12: where a rate limit that acts by the call holds a value it took
# from an input, a catch-up tick is one with a usable input for rules 3
# and 4, whatever it read. The input is lost from tick 1 and ride_through
# is 1 s. Tick 1 rides through. Tick 2 is a catch-up tick, and ends the
# run of unusable ticks; so tick 3, the last of that call, is the first
# unusable tick again and rides through, and tick 4 is the second and
# forgets.
rules: [7.4.12, 7.4.3, 7.4.4]
period: 1s
commands: [cmd]
inputs: {x: {max_age: none}}
blocks:
  - {id: slew, type: rate_limit, in: {x: x}, settings: {up: 1, ride_through: 1s}, out: {y: cmd}}
calls:
  - {now: 0, x: 5, cmd: 5}
  - {now: 1, x: bad, cmd: {u: 5}}
  - {now: 3, ran: 2, cmd: {u: 5}}
  - {now: 4, cmd: bad}
