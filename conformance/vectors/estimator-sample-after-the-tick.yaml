# 7.9.2, 7.9.8: the last tick of a call may see a sample taken after its
# own time. The call at 1.25 s runs tick 1, whose time is 1 s, and its
# sample is at place 20. The state is carried there and is given as it
# stands, and not carried back. The model is x' = u with u of 16 and q of
# 16 a second: at place 20 x is 20 with a variance of 20.5; an innovation of
# 10 over a spread of 21.5 gives 20 and 10 times 41/43.
rules: [7.9.2, 7.9.8, 6.8]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: 16, z: z}
    settings:
      model: {type: linear, A: [[0]], B: [[1]], C: [[1]]}
      q: {x0: 16}
      p0: {x0: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
    out: {x0: x, sigma_x0: sigma, innovation_z: innovation}
calls:
  - {now: 0, z: 0, x: 0, sigma: 0.7071067811865476, innovation: 0}
  - {now: 1.25, z: 30, x: 29.53488372093023, sigma: 0.9764672918705589, innovation: 10}
