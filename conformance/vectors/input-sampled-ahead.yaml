# 7.2.4: a sample time more than one period after the tick is bad. Up to one
# period ahead its age is zero (6.6).
rules: [7.2.4, 6.6]
period: 1s
inputs: {x: {max_age: 2s}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
calls:
  - {x: {v: 5, at: 100}, y: bad}
  - {x: {v: 6, at: 1.9}, y: 6}         # now 1: 0.9 s ahead
  - {y: 6}                             # now 2: age 0.1 s
  - {x: {v: 7, at: 4.5}, y: bad}       # now 3: 1.5 s ahead
