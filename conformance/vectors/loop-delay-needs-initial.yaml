# 5.4: a delay on a loop has an initial value, or the graph is refused.
rules: [5.4]
period: 1s
inputs: {x: {}}
blocks:
  - {id: prev, type: delay, in: {x: acc}}
  - {id: sum, type: formula, in: {p: prev.y, x: x}, settings: {expr: "p + x"}, out: {y: acc}}
expect: compile_error
error_mentions: [prev]
