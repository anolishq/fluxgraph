# 7.9.9, 7.9.3: after a rebase no remembered place means anything, and the
# next measurement due is the first: one older than the state is
# considered where it stands, and is not late. The variance of 1/2 grows by
# p0 to 3/2; an innovation of 2 then gives 6/5.
rules: [7.9.9, 7.9.3, 8.5]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: 0, z: z}
    settings: {model: {type: linear, A: [[0]], B: [[1]], C: [[1]]}, q: {x0: 0}, p0: {x0: 1}, measure: {z: {of: y, r: 1}}, consistency: none}
    out: {x0: x, sigma_x0: sigma, innovation_z: innovation, late_z: late}
calls:
  - {now: 0, z: 0, x: 0, sigma: 0.7071067811865476, innovation: 0, late: 0}
  - {$save: a}
  - {$restore: a}
  - {now: 7, gap: true, tick: 1, time: 7, z: {v: 2, at: 5}, x: {u: 1.2}, sigma: {u: 0.7745966692414834}, innovation: 2, late: 0}
