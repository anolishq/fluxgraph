# 7, 8.6: every block that gives elapsed gives gaps: the gaps at or after
# the tick elapsed counts from. A gap leaves a hysteresis's and a latch's
# counts going, sets since_true's clock, stops held_for's timer, and adds
# nothing to a model's doubtful. A rebase is a gap, and sets no count to
# zero. Ticks 0 and 1, a restore, ticks 2 and 3, a rebase, ticks 4 and 5.
rules: [7, 8.6, 7.5.4, 7.6.1, 7.6.2, 7.6.3, 7.8.6]
period: 1s
inputs: {x: {max_age: none}, b: {type: boolean, max_age: none}}
blocks:
  - {id: h, type: hysteresis, in: {x: x}, settings: {rise: 10, fall: 5}, out: {elapsed: he, doubtful: hd, gaps: hg}}
  - {id: l, type: latch, in: {set: b}, out: {elapsed: le, gaps: lg}}
  - {id: st, type: since_true, in: {x: b}, settings: {time: 2s, on_bad: assume_false}, out: {elapsed: se, gaps: sg}}
  - {id: hf, type: held_for, in: {x: b}, settings: {time: 1s, on_bad: reset}, out: {elapsed: fe, gaps: fg}}
  - {id: m, type: state_space, in: {u: x}, settings: {A: [[1]], B: [1], C: [1]}, out: {elapsed: me, doubtful: md, gaps: mg}}
calls:
  - {x: 12, b: false, he: 1, hd: 0, hg: 0, le: 1, lg: 0, se: 1, sg: 0, fe: 0, fg: 0, me: 1, md: 0, mg: 0}
  - {x: {v: 12, state: uncertain}, b: false, he: 2, hd: 1, hg: 0, le: 2, lg: 0, se: 2, sg: 0, fe: 0, fg: 0, me: 2, md: 0, mg: 0}
  - {$save: a}
  - {$restore: a}
  # tick 2, a gap. The clock is set and the timer starts at the gap's tick, so each counts it
  - {now: 50, gap: true, x: 12, b: true, he: 3, hd: 1, hg: 1, le: 3, lg: 1, se: 1, sg: 1, fe: 1, fg: 1, me: 3, md: 1, mg: 1}
  # tick 3: the clock is set again, after the gap
  - {now: 51, x: 12, b: true, he: 4, hd: 1, hg: 1, le: 4, lg: 1, se: 1, sg: 0, fe: 2, fg: 1, me: 4, md: 1, mg: 1}
  - {$rebase: true}
  - {now: 200, gap: true, x: 12, b: false, he: 5, hd: 1, hg: 2, le: 5, lg: 2, se: 1, sg: 1, fe: 0, fg: 0, me: 5, md: 1, mg: 2}
  # tick 5: the hysteresis changes, and its counts start again
  - {now: 201, x: 4, b: false, he: 1, hd: 0, hg: 0, le: 6, lg: 2, se: 2, sg: 1, fe: 0, fg: 0, me: 6, md: 1, mg: 2}
