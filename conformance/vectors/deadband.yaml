# Appendix A, 7.4.1 to 7.4.4: a deadband takes its first usable input as it
# is, then keeps what it holds until the input has moved by the step or
# more. Its output takes the state of the input at this tick. Past
# ride_through it forgets, and the next input is a first input.
rules: [A.deadband, 7.4.1, 7.4.2, 7.4.3, 7.4.4]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: d, type: deadband, in: {x: x}, settings: {step: 1}, out: {y: y}}
calls:
  - {x: not_ready, y: not_ready}
  - {x: 10, y: 10}
  - {x: 10.5, y: 10}
  - {x: 11, y: 11}            # moved by exactly the step
  - {x: 10.25, y: 11}
  - {x: 10, y: 10}
  - {x: {v: 10.5, state: uncertain}, y: {u: 10}}    # kept, on an uncertain input
  - {x: 10.5, y: 10}          # the input is good
  - {x: {v: 12, state: uncertain}, y: {u: 12}}      # took an uncertain sample
  - {x: 12.5, y: 12}     # holds it still, and the input is good
  - {x: 14, y: 14}
  - {x: bad, y: bad}          # ride_through is zero: forgotten
  - {x: 14.5, y: 14.5}        # a first input again
