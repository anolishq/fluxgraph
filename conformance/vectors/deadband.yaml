# Appendix A, 7.4.1, 7.4.4: a deadband takes its first usable input as it
# is, then keeps its output until the input has moved by the step or more.
# It keeps what it holds through an unusable input.
rules: [A.deadband, 7.4.1, 7.4.2, 7.4.3, 7.4.4]
period: 1s
inputs: {x: {}}
blocks:
  - {id: d, type: deadband, in: {x: x}, settings: {step: 1}, out: {y: y}}
calls:
  - {x: not_ready, y: not_ready}
  - {x: 10, y: 10}
  - {x: 10.5, y: 10}
  - {x: 11, y: 11}            # moved by exactly the step
  - {x: 10.25, y: 11}
  - {x: 10, y: 10}
  - {x: {v: 10.5, state: uncertain}, y: {u: 10}}
  - {x: bad, y: bad}          # ride_through is zero
  - {x: 10.5, y: 10}          # still holding 10
  - {x: 20, y: 20}
