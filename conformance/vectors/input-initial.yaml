# 7.2.1: an input that declares an initial value is uncertain, with that
# value, until it is written, for as long as the graph has run for no more
# than its maximum age.
rules: [7.2.1]
period: 1s
inputs: {x: {max_age: 1s, initial: 20}, run: {type: boolean, max_age: none, initial: true}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 1"}, out: {y: y}}
  - {id: g, type: formula, in: {run: run}, settings: {expr: "not run"}, out: {y: idle}}
calls:
  - {y: {u: 21}, idle: {u: false}}
  - {y: {u: 21}, idle: {u: false}}     # has run 1 s
  - {y: bad, idle: {u: false}}         # has run 2 s
  - {x: 5, run: false, y: 6, idle: true}
