# 8.6, 7.6.2: at a stall the clock is not set. The ticks passed over count:
# at tick 4 the input was last true 4 ticks ago, longer than 3 s, and
# elapsed and doubtful have gone up by the two ticks nobody saw, gaps by
# one.
rules: [8.6, 7.6.2]
period: 1s
max_catch_up: 1
inputs: {x: {type: boolean, max_age: none}}
blocks:
  - {id: s, type: since_true, in: {x: x}, settings: {time: 3s, on_bad: assume_false}, out: {y: y, elapsed: elapsed, doubtful: doubtful, gaps: gaps}}
calls:
  - {now: 0, x: true, y: false, elapsed: 1, doubtful: 0, gaps: 0}
  - {now: 1, x: false, y: false, elapsed: 2, doubtful: 0, gaps: 0}
  - {now: 4, gap: true, skipped: 2, x: false, y: true, elapsed: 5, doubtful: 2, gaps: 1}
