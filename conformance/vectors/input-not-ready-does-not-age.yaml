# 7.7: a write of not_ready has no sample, so it does not grow old and turn bad.
rules: [7.7]
period: 1s
inputs: {x: {max_age: 1s}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: x + 0}, out: {y: y}}
ticks:
  - {x: not_ready, y: not_ready}
  - {y: not_ready}
  - {y: not_ready}
  - {y: not_ready}
  - {x: 5, y: 5}
  - {y: 5}
  - {y: bad}
