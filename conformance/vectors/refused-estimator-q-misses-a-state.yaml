# Appendix A: q is a map from each state's name to a number. One that
# leaves a state out is refused.
rules: [A.estimator]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: 0, z: z}
    settings:
      model: {type: state_space, A: [[1, 0], [0, 1]], B: [0, 0], C: [1, 0]}
      q: {x0: 1}
      p0: {x0: 1, x1: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
expect: compile_error
error_mentions: [q]
