# 8.4: a stall is on one clock, and a block keeps the sample times it
# remembers. x is written once. The window is emptied by the gap, and the
# sample still standing is not a new one.
rules: [8.4, 7.3.7]
period: 1s
max_catch_up: 3
inputs: {x: {max_age: none}}
blocks:
  - {id: w, type: window, in: {x: x}, settings: {window: 3s, min_good: 0.3, only_new: true}, out: {count: count}}
calls:
  - {now: 0, x: 1, count: 1}
  - {now: 10, gap: true, tick: 1, time: 10, count: 0}
