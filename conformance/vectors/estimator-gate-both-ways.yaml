# 7.9.5: over the gate "either way": an innovation of -4 is refused as one
# of 4 is. The spread is 4 and the gate 1.5.
rules: [7.9.5]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: 0, z: z}
    settings: {model: {type: state_space, A: [[1]], B: [0], C: [1]}, q: {x0: 0}, p0: {x0: 3}, measure: {z: {of: y, r: 1}}, consistency: none, gate: 1.5, max_refused: 3}
    out: {x0: x, innovation_z: innovation, refused_z: count}
calls:
  - {z: -4, x: {u: 0}, innovation: -4, count: 1}
