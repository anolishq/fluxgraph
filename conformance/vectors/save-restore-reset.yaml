# 8.1 to 8.6: a restore puts the blocks back, and the next call is a gap:
# one tick, numbered after the last one saved, at whatever time it is given.
# A reset starts again from tick 0.
rules: [8.1, 8.2, 8.3, 8.5, 8.6]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: i, type: integrate, in: {x: x}, out: {y: total}}
  - {id: w, type: window, in: {x: x}, settings: {window: 2s}, out: {mean: mean}}
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
calls:
  - {x: 1, total: 1, mean: not_ready, y: 1}
  - {x: 1, total: 2, mean: 1, y: 1}
  - {$save: a}
  - {x: 5, total: 7, mean: 3, y: 5}
  - {x: 5, total: 12, mean: 5, y: 5}
  - {$restore: a}
  # an earlier time than the last call's is accepted after a restore. the window held 1 and 1, and is emptied
  - {now: 2, gap: true, tick: 2, time: 2, x: 5, total: {u: 7}, mean: not_ready, y: 5}
  - {now: 3, total: {u: 12}, mean: 5, y: 5}
  - {now: 4, x: 1, total: {u: 13}, mean: 3, y: 1}
  - {$reset: true}
  # an earlier time is accepted after a reset too, and nothing stands on x
  - {now: 1, total: {u: 0}, mean: not_ready, y: not_ready}
  - {now: 2, x: 5, total: {u: 5}, mean: not_ready, y: 5}
  - {now: 3, total: {u: 10}, mean: 5, y: 5}
