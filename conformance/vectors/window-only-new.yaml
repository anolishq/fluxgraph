# 7.3.8: with only_new a tick holds a sample only when the input's sample
# time has moved on. min_good of 0.3 over three ticks needs one good sample;
# a good window gives the statistics of its good samples alone.
rules: [7.3.7, 7.3.3]
period: 1s
inputs: {x: {max_age: none}}
blocks:
  - {id: w, type: window, in: {x: x}, settings: {window: 3s, min_good: 0.3, only_new: true}, out: {mean: mean, count: count}}
calls:
  - {x: 2, mean: 2, count: 1}
  - {mean: 2, count: 1}
  - {x: {v: 4, state: uncertain}, mean: 2, count: 2}
  - {mean: {u: 4}, count: 1}
  - {x: 6, mean: 6, count: 2}
  - {mean: 6, count: 1}
  - {mean: 6, count: 1}
  - {mean: not_ready, count: 0}
