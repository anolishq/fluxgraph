# 7.8.8: refused: two models on a loop given different settle.
rules: [7.8.8]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: a, type: state_space, in: {u: f.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}}
  - {id: b, type: state_space, in: {u: a.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 3s}}
  - {id: f, type: formula, in: {r: r, y: b.y}, settings: {expr: "r - y"}}
expect: compile_error
error_mentions: [settle]
