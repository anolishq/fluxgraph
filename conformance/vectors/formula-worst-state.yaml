# 7.1.1, 3.3: an operation takes the worst state among its operands: bad,
# then not_ready, then uncertain, then good.
rules: [7.1.1, 3.3]
period: 1s
inputs: {x: {max_age: none}, y: {max_age: none}}
blocks:
  - {id: f, type: formula, in: {x: x, y: y}, settings: {expr: "x + y"}, out: {y: sum}}
calls:
  - {x: 1, y: 2, sum: 3}
  - {x: {v: 1, state: uncertain}, y: 2, sum: {u: 3}}
  - {x: bad, y: not_ready, sum: bad}
  - {x: not_ready, y: {v: 2, state: uncertain}, sum: not_ready}
  - {x: bad, y: {v: 2, state: uncertain}, sum: bad}
