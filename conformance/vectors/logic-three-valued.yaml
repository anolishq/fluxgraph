# 7.1.2: one true operand decides an or, one false operand decides an and.
rules: [7.1.2]
period: 1s
inputs: {a: {}, b: {}}
blocks:
  - {id: o, type: formula, in: {a: a, b: b}, settings: {expr: a or b}, out: {y: either}}
  - {id: n, type: formula, in: {a: a, b: b}, settings: {expr: a and b}, out: {y: both}}
ticks:
  - {a: 1, b: 0, either: true, both: false}
  - {a: 1, b: bad, either: true, both: bad}
  - {a: 0, b: bad, either: bad, both: false}
  - {a: 0, b: not_ready, either: not_ready, both: false}
  - {a: bad, b: not_ready, either: bad, both: bad}
  - {a: 0, b: 0, either: false, both: false}
  - {a: 1, b: 1, either: true, both: true}
