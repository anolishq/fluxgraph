# A median over three samples ignores one wild sample that arrives as good.
rules: [7.2.1]
period: 1s
inputs: {x: {}}
blocks:
  - {id: w, type: window, in: {x: x}, settings: {window: 3s}, out: {median: median}}
ticks:
  - {x: 30, median: not_ready}
  - {x: 30, median: not_ready}
  - {x: 1.8, median: 30}
  - {x: 30, median: 30}
  - {x: 30, median: 30}
  - {x: 31, median: 30}
