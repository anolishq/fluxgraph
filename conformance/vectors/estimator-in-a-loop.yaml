# 7.9.2, 5.3: an estimator's model inputs are deferred, so a loop through
# one compiles. Its input is minus its own state: x' = x + 0.5 u = 0.5 x.
rules: [7.9.2, 5.3]
period: 1s
inputs: {z: {max_age: none}}
blocks:
  - id: k
    type: estimator
    in: {u: f.y, z: z}
    settings:
      model: {type: state_space, A: [[1]], B: [0.5], C: [1], initial: [8]}
      q: {x0: 0}
      p0: {x0: 1}
      measure: {z: {of: y, r: 1}}
      consistency: none
    out: {x0: x}
  - {id: f, type: formula, in: {x: k.x0}, settings: {expr: "0 - x"}}
calls:
  - {x: 8}
  - {x: 4}
  - {x: 2}
