# 7.2.5: an age is the tick's time less the sample time, not the call's.
rules: [7.2.5, 6.5]
period: 1s
inputs: {x: {max_age: 1s}}
blocks:
  - {id: f, type: formula, in: {x: x}, settings: {expr: "x + 0"}, out: {y: y}}
calls:
  - {now: 0, x: 5, y: 5}
  - {now: 1.4, y: 5}              # tick 1 is at 1.0: 1 s old
  - {now: 2, y: bad}
