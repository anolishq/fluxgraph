# 7.8.8: refused: a model that reads its own output is a loop, and is not given settle.
rules: [7.8.8]
period: 1s
inputs: {r: {max_age: none}}
blocks:
  - {id: plant, type: state_space, in: {u: plant.y}, settings: {A: [[0.5]], B: [0.5], C: [1]}}
  - {id: f, type: formula, in: {r: r, y: plant.y}, settings: {expr: "r - y"}}
expect: compile_error
error_mentions: [settle]
