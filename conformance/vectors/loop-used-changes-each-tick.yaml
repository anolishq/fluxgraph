# 7.8.8, rule D: what a formula used is what it used at that tick. At tick
# 0 the choice takes r - y, and the bad q in the branch not taken starts
# no doubt. At tick 1 it takes q - y with q uncertain: that is used, and
# tick 1 is the loop's doubt. The model is uncertain at ticks 2 and 3, for
# its settle of 2 s. x' = 0.5 x + 0.5 u.
rules: [7.8.8, D, 7.1.3]
period: 1s
inputs: {c: {type: boolean, max_age: none}, q: {max_age: none}, r: {max_age: none}}
blocks:
  - {id: plant, type: state_space, in: {u: ctl.y}, settings: {A: [[0.5]], B: [0.5], C: [1], settle: 2s}, out: {y: y}}
  - {id: ctl, type: formula, in: {c: c, q: q, r: r, y: plant.y}, settings: {expr: "when(c, r - y, q - y)"}, out: {y: u}}
calls:
  - {c: true, r: 1, q: bad, y: 0, u: 1}
  - {c: false, q: {v: 1, state: uncertain}, y: 0.5, u: {u: 0.5}}
  - {q: 1, y: {u: 0.5}, u: {u: 0.5}}
  - {y: {u: 0.5}, u: {u: 0.5}}
  - {y: 0.5, u: 0.5}
